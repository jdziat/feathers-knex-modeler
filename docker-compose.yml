# Local Postgres for running the DB-backed integration tests.
#
#   docker compose up -d --wait        # start Postgres, block until healthy
#   npm run test:integration           # runs against postgres://postgres:postgres@127.0.0.1:5432/myapp_test
#   docker compose down                # stop and remove
#
# Or in one shot: `npm run test:integration:docker`.
# Matches the postgres:16 service used by the CI integration job.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
